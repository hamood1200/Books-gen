<!-- @dsCard group="Brand" viewport="700x400" name="3D book mockup" subtitle="The chosen cover on a hardback, with spine and page block" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Najdeah book — 3D mockup</title>
<link rel="stylesheet" href="../../_ds/najdeah-books-design-system-05cd8eb3-d992-44f2-9dc8-3ba0facc03a3/styles.css">
<style>
html,body{margin:0;height:100%}
body{background:radial-gradient(120% 90% at 50% 8%,#f7fafa 0%,#dfe6e6 62%,#c9d2d2 100%);display:grid;place-items:center;font-family:var(--font-body)}
.scene{perspective:2400px;perspective-origin:50% 42%}
.book{position:relative;width:420px;height:594px;transform-style:preserve-3d;transform:scale(.74) rotateX(4deg) rotateY(-26deg) rotateZ(-0.6deg);animation:settle 1.1s var(--ease-standard) both}
@keyframes settle{from{transform:scale(.74) rotateX(6deg) rotateY(-37deg) rotateZ(-1deg)}to{transform:scale(.74) rotateX(4deg) rotateY(-26deg) rotateZ(-0.6deg)}}
.face{position:absolute;inset:0;transform-style:preserve-3d;backface-visibility:hidden}
/* front board */
.front{transform:translateZ(21px);overflow:hidden;background:var(--najdeah-navy);box-shadow:inset -1px 0 0 rgba(255,255,255,.32),inset 0 0 44px rgba(8,16,30,.3)}
.front img.photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.front .veil{position:absolute;inset:0;background:var(--gradient-cover-protection)}
/* light raking across the board, hinge shadow at the spine */
.front .light{position:absolute;inset:0;background:linear-gradient(264deg,rgba(6,12,22,.42) 0%,rgba(6,12,22,.14) 5%,rgba(255,255,255,.1) 24%,rgba(255,255,255,.02) 60%,rgba(255,255,255,.14) 96%)}
/* spine */
.spine{position:absolute;top:0;right:0;width:42px;height:100%;transform-origin:right center;transform:rotateY(90deg) translateX(21px);background:var(--gradient-navy);box-shadow:inset 0 0 30px rgba(0,0,0,.55)}
.spine .sheen{position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.5) 0%,rgba(255,255,255,.12) 46%,rgba(0,0,0,.42) 100%)}
.spine .txt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:34px 0}
.spine .title{writing-mode:vertical-rl;transform:rotate(180deg);color:#fff;font:var(--weight-display) 15px/1 var(--font-display);letter-spacing:.01em;white-space:nowrap}
.spine .rule{width:20px;height:var(--border-width-rule);background:var(--najdeah-orange)}
.spine img{width:24px;opacity:.95}
/* page block: stacked leaves on the fore-edge */
.pages{position:absolute;top:5px;left:0;width:38px;height:calc(100% - 10px);transform-origin:left center;transform:rotateY(-90deg) translateX(-19px);background:repeating-linear-gradient(90deg,#fdfdfb 0px,#fdfdfb 1px,#e2e0d8 1px,#e2e0d8 2.3px);box-shadow:inset 0 0 18px rgba(90,84,70,.4)}
.pages .curve{position:absolute;inset:0;background:linear-gradient(270deg,rgba(60,54,44,.32) 0%,rgba(255,255,255,.22) 30%,rgba(60,54,44,.12) 100%)}
/* back board sliver + head edge */
.back{transform:translateZ(-21px);background:var(--najdeah-navy-deep)}
.head{position:absolute;left:0;top:0;width:100%;height:42px;transform-origin:top center;transform:rotateX(90deg) translateY(-21px);background:repeating-linear-gradient(0deg,#fdfdfb 0px,#fdfdfb 1px,#e4e2da 1px,#e4e2da 2.4px);box-shadow:inset 0 0 20px rgba(90,84,70,.35)}
.head .board{position:absolute;left:0;right:0;top:0;height:3px;background:var(--najdeah-navy)}
.head .board2{position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--najdeah-navy-deep)}
/* contact shadow on the surface */
.shadow{position:absolute;left:-8%;bottom:-46px;width:112%;height:88px;background:radial-gradient(50% 50% at 46% 50%,rgba(18,30,46,.46) 0%,rgba(18,30,46,.18) 48%,rgba(18,30,46,0) 78%);filter:blur(9px);transform:rotateX(84deg) translateZ(-40px) scaleY(.5)}
/* cover artwork */
.art{position:absolute;inset:0}
.art .logo{position:absolute;left:var(--page-margin-x);top:26px;width:58px}
.art .block{position:absolute;left:var(--page-margin-x);right:var(--page-margin-x);top:53.5%}
.art .orule{width:64px;height:var(--border-width-rule);background:var(--najdeah-orange);margin-bottom:18px}
.art h1{margin:0;color:#fff;font:var(--weight-display) var(--text-cover-title)/1.12 var(--font-display);letter-spacing:-.01em}
.art .by{margin:12px 0 0;color:#fff;font:var(--weight-regular) var(--text-cover-byline)/1.4 var(--font-body);opacity:.92}
.art .blurb{margin:24px 0 0;max-width:270px;color:#fff;opacity:.86;font:var(--weight-regular) var(--text-small)/1.5 var(--font-body);text-align:justify;hyphens:auto}
.art .bar{position:absolute;left:0;right:0;bottom:0;height:34px;background:var(--gradient-navy);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 var(--page-margin-x);font:var(--weight-regular) var(--text-edition)/1.2 var(--font-body)}
a{color:var(--link)}a:hover{color:var(--link-hover)}
</style></head><body>
<div class="scene"><div class="book">
  <div class="shadow"></div>
  <div class="face back"></div>
  <div class="pages"><div class="curve"></div></div>
  <div class="head"><div class="board"></div><div class="board2"></div></div>
  <div class="spine"><div class="sheen"></div><div class="txt">
    <span class="title">Solar PV Plant Design Guide</span>
    <span class="rule"></span>
    <img src="../../assets/logo-najdeah-white.png" alt="Najdeah">
  </div></div>
  <div class="face front">
    <img class="photo" src="../../assets/cover-ground-mount.jpg" alt="">
    <div class="veil"></div>
    <div class="art">
      <img class="logo" src="../../assets/logo-najdeah-white.png" alt="Najdeah">
      <div class="block">
        <div class="orule"></div>
        <h1>Solar PV Plant<br>Design Guide</h1>
        <p class="by">By Nooralden Najdeah</p>
        <p class="blurb">A structured technical reference for professionals and students working in solar photovoltaics, drawn from design and engineering experience across the Middle East.</p>
      </div>
      <div class="bar"><span>Second Edition</span><span>2025</span></div>
    </div>
    <div class="light"></div>
  </div>
</div></div>
</body></html>
